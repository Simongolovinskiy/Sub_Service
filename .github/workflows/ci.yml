name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: asyncpy_test
          POSTGRES_USER: asyncpy_test
          POSTGRES_PASSWORD: asyncpy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U asyncpy_test -d asyncpy_test"
          --health-interval 1s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.17"
          python-version: "3.12"
          enable-cache: true
      - run: make test
        env:
          TEST_DATABASE_URL: postgresql://asyncpy_test:asyncpy_test@localhost:5432/asyncpy_test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: asyncpytemplate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm asyncpytemplate:ci python -c "from app.application.factory import create_app; create_app()"
